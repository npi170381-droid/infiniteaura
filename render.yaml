services:
  # Movie Ticket Booking System Service (Unified Monolith)
  - type: web
    name: ticket-booking-app
    env: node
    buildCommand: npm install && npm run build
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000 # Render assigns a port, Flask/Express binds to process.env.PORT
